<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>نظام الكونكريت - اشتراك</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
<style>@import url('https://fonts.googleapis.com/css2?family=Tajawal:wght@700&display=swap');body{font-family:'Tajawal',sans-serif;background:#0f172a}.glass{background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.1)}</style>
</head>
<body class="text-white min-h-screen">

<!-- دخول بالكود -->
<div id="login" class="min-h-screen flex flex-col items-center justify-center p-6">
  <div class="w-20 h-20 bg-orange-500 rounded-2xl flex items-center justify-center text-3xl mb-4"><i class="fa-solid fa-truck-pickup"></i></div>
  <h1 class="text-2xl font-bold">نظام الكونكريت</h1>
  <p class="text-slate-400 text-xs mt-2 mb-6">اشتراك شهري - دفع إلكتروني</p>
  <input id="code" placeholder="كود الشركة CONC-XXXXXX" class="w-full max-w-sm bg-slate-800 p-4 rounded-2xl text-center mb-3 tracking-widest">
  <button onclick="loginCompany()" class="w-full max-w-sm bg-orange-500 p-4 rounded-2xl font-bold">دخول</button>
  <button onclick="superLogin()" class="mt-6 text-xs text-slate-500">دخول المالك 👑</button>
</div>

<!-- شاشة القفل عند انتهاء الاشتراك -->
<div id="locked" class="hidden min-h-screen flex flex-col items-center justify-center p-6 text-center bg-black">
  <div class="w-24 h-24 bg-red-600 rounded-full flex items-center justify-center text-4xl mb-6"><i class="fa-solid fa-lock"></i></div>
  <h1 class="text-3xl font-bold text-red-500">التطبيق متوقف</h1>
  <p class="text-slate-300 mt-3">انتهت مدة اشتراك شركتكم</p>
  <p id="lockedCompany" class="font-bold mt-1"></p>
  <p id="lockedDate" class="text-xs text-slate-500 mt-1"></p>
  <div class="glass p-5 rounded-2xl mt-8 w-full max-w-sm border border-red-500/30">
    <h3 class="font-bold mb-3">جدد اشتراكك للمتابعة</h3>
    <div class="grid grid-cols-1 gap-2 text-sm">
      <button onclick="payElectronic(49,30)" class="bg-green-600 p-3 rounded-xl font-bold">دفع $49 - تجديد 30 يوم 💳</button>
      <button onclick="payElectronic(129,90)" class="bg-blue-600 p-3 rounded-xl font-bold">دفع $129 - تجديد 90 يوم 🔥</button>
      <button onclick="payElectronic(499,365)" class="bg-orange-500 p-3 rounded-xl font-bold">دفع $499 - تجديد سنة كاملة 👑</button>
    </div>
    <p class="text-[10px] text-slate-500 mt-3">الدفع الإلكتروني: بطاقة / زين كاش / Qi / MasterCard<br>التفعيل فوري تلقائياً بعد الدفع</p>
  </div>
  <div id="payStatus" class="mt-4 text-sm"></div>
</div>

<!-- Super Admin -->
<div id="super" class="hidden p-4">
  <h2 class="font-bold text-xl mb-4">👑 لوحة المالك - المبيعات</h2>
  <div class="glass p-4 rounded-2xl mb-4">
    <input id="cName" placeholder="اسم الشركة الجديدة" class="w-full bg-slate-800 p-3 rounded-xl mb-2 text-sm">
    <input id="cPhone" placeholder="واتساب الشركة" class="w-full bg-slate-800 p-3 rounded-xl mb-2 text-sm">
    <button onclick="createCompany()" class="w-full bg-green-600 p-3 rounded-xl font-bold">إنشاء كود + تفعيل 30 يوم مجانا للتجربة</button>
  </div>
  <div id="comps"></div>
  <button onclick="location.reload()" class="w-full glass mt-4 p-3 rounded-xl">خروج</button>
</div>

<!-- التطبيق الكامل - كل المميزات السابقة -->
<div id="app" class="hidden p-4">
  <div class="flex justify-between items-center mb-4">
    <div><h2 id="compName" class="font-bold"></h2><p id="expInfo" class="text-xs text-green-400"></p></div>
    <button onclick="location.reload()" class="bg-red-600 px-3 py-2 rounded-xl text-xs">خروج</button>
  </div>
  <div class="grid grid-cols-3 gap-2 mb-4">
    <div class="glass p-3 rounded-xl text-center"><p class="text-[10px] text-slate-400">الصادرات</p><p id="eT" class="font-bold text-green-400 text-sm">0</p></div>
    <div class="glass p-3 rounded-xl text-center"><p class="text-[10px] text-slate-400">الواردات</p><p id="iT" class="font-bold text-red-400 text-sm">0</p></div>
    <div class="glass p-3 rounded-xl text-center"><p class="text-[10px] text-slate-400">الصافي</p><p id="nT" class="font-bold text-sm">0</p></div>
  </div>
  <div class="flex gap-2 mb-4 overflow-auto">
    <button onclick="aTab('orders')" class="aTab bg-orange-500 px-3 py-2 rounded-xl text-xs">الطلبات</button>
    <button onclick="aTab('prices')" class="aTab glass px-3 py-2 rounded-xl text-xs">الأسعار ⚙️</button>
    <button onclick="aTab('drivers')" class="aTab glass px-3 py-2 rounded-xl text-xs">السواق + البصمة + الوصولات</button>
    <button onclick="aTab('imports')" class="aTab glass px-3 py-2 rounded-xl text-xs">الواردات</button>
    <button onclick="aTab('exports')" class="aTab glass px-3 py-2 rounded-xl text-xs">الصادرات</button>
    <button onclick="aTab('money')" class="aTab glass px-3 py-2 rounded-xl text-xs">الفلوس</button>
  </div>
  <div id="a_orders" class="aSec"><div class="glass p-4 rounded-2xl mb-3"><input id="oC" placeholder="اسم الزبون" class="w-full bg-slate-800 p-3 rounded-xl mb-2 text-sm"><div class="grid grid-cols-2 gap-2 mb-2"><input id="oQ" type="number" placeholder="م3" class="bg-slate-800 p-3 rounded-xl text-sm"><select id="oT" class="bg-slate-800 p-3 rounded-xl text-sm"></select></div><select id="oD" class="w-full bg-slate-800 p-3 rounded-xl mb-2 text-sm"></select><input id="oL" placeholder="الموقع" class="w-full bg-slate-800 p-3 rounded-xl mb-3 text-sm"><button onclick="addO()" class="w-full bg-orange-500 p-3 rounded-xl font-bold">إضافة + بصمة استلام</button></div><div id="oL"></div></div>
  <div id="a_prices" class="aSec hidden"><div id="pE"></div><button onclick="saveP()" class="w-full bg-green-600 mt-2 p-3 rounded-xl">حفظ الأسعار</button></div>
  <div id="a_drivers" class="aSec hidden"><div class="flex gap-2 mb-3"><input id="dN" placeholder="اسم السائق" class="flex-1 bg-slate-800 p-3 rounded-xl text-sm"><input id="dC" placeholder="رقم السيارة" class="flex-1 bg-slate-800 p-3 rounded-xl text-sm"></div><button onclick="addD()" class="w-full bg-blue-600 p-3 rounded-xl mb-3">إضافة سائق</button><div class="glass p-4 rounded-2xl text-center mb-3"><div onclick="doFP()" class="w-16 h-16 bg-orange-500 rounded-full mx-auto flex items-center justify-center cursor-pointer"><i class="fa-solid fa-fingerprint"></i></div><p id="fpS" class="text-xs mt-2">بصمة حضور</p></div><div id="dL"></div><div class="glass p-3 rounded-xl mt-3"><p class="font-bold text-xs">محفظة وصولاتي + الراتب</p><div id="wL" class="mt-2"></div><p id="sal" class="font-bold text-sm mt-2"></p></div></div>
  <div id="a_imports" class="aSec hidden"><div class="grid grid-cols-2 gap-2 mb-2"><input id="imI" placeholder="المادة" class="bg-slate-800 p-3 rounded-xl text-sm"><input id="imC" type="number" placeholder="الكلفة" class="bg-slate-800 p-3 rounded-xl text-sm"></div><button onclick="addIm()" class="w-full bg-blue-600 p-3 rounded-xl mb-3">حفظ وارد</button><div id="imL"></div></div>
  <div id="a_exports" class="aSec hidden"><div id="exL"></div></div>
  <div id="a_money" class="aSec hidden"><div id="moL"></div></div>
</div>

<script>
let saas=JSON.parse(localStorage.getItem('saas3')||'{"companies":[]}');
let db=JSON.parse(localStorage.getItem('concreteFinal')||'{"orders":[],"imports":[],"exports":[],"prices":[{"name":"C20","price":65000},{"name":"C25","price":75000},{"name":"C30","price":85000},{"name":"C35","price":95000}],"drivers":[],"attendance":[],"receipts":[]}');
let active=null;
function save(){localStorage.setItem('concreteFinal',JSON.stringify(db)); localStorage.setItem('saas3',JSON.stringify(saas))}
function loginCompany(){
  let code=document.getElementById('code').value.trim(); let c=saas.companies.find(x=>x.code===code);
  if(!c)return alert('كود خاطئ');
  active=c;
  let now=new Date(), exp=new Date(c.expiry);
  if(now>exp){
    // قفل التطبيق
    document.getElementById('login').classList.add('hidden');
    document.getElementById('locked').classList.remove('hidden');
    document.getElementById('lockedCompany').innerText=c.name;
    document.getElementById('lockedDate').innerText='انتهى في: '+exp.toLocaleDateString();
    return;
  }
  document.getElementById('login').classList.add('hidden');
  document.getElementById('app').classList.remove('hidden');
  document.getElementById('compName').innerText=c.name;
  document.getElementById('expInfo').innerText='مفعل حتى '+exp.toLocaleDateString()+' - باقي '+Math.ceil((exp-now)/86400000)+' يوم';
  render();
}
function payElectronic(amount,days){
  document.getElementById('payStatus').innerHTML='<p class="text-yellow-400">جاري تحويلك لبوابة الدفع الإلكتروني... 💳</p>';
  setTimeout(()=>{
    document.getElementById('payStatus').innerHTML='<p class="text-blue-400">تم الدفع بنجاح $'+amount+' ✅<br>جاري تفعيل الاشتراك...</p>';
    setTimeout(()=>{
      let exp=new Date(active.expiry); let now=new Date();
      if(exp<now)exp=now;
      exp.setDate(exp.getDate()+days); active.expiry=exp.toISOString(); save();
      alert('تم تجديد الاشتراك بنجاح ✅\nمفعل حتى: '+exp.toLocaleDateString());
      location.reload();
    },1500);
  },1500);
}
function superLogin(){let p=prompt('كلمة سر المالك: admin123'); if(p!=='admin123')return; document.getElementById('login').classList.add('hidden'); document.getElementById('super').classList.remove('hidden'); renderSuper()}
function createCompany(){let n=document.getElementById('cName').value, ph=document.getElementById('cPhone').value; if(!n)return; let code='CONC-'+Math.random().toString(36).substr(2,6).toUpperCase(); let ex=new Date(); ex.setDate(ex.getDate()+14); saas.companies.push({id:Date.now(),name:n,phone:ph,code:code,expiry:ex.toISOString(),created:new Date().toLocaleString('ar-EG')}); save(); renderSuper(); alert('كود الشركة: '+code+' - فعال 14 يوم مجانا');}
function renderSuper(){document.getElementById('comps').innerHTML=saas.companies.map(c=>{let ex=new Date(c.expiry), left=Math.ceil((ex-new Date())/86400000); return `<div class="glass p-3 rounded-xl mb-2 flex justify-between ${left<=0?'border border-red-500':''}"><div><b>${c.name}</b><p class="text-xs text-slate-400">كود: ${c.code} | ${c.phone}</p><p class="text-xs ${left<=0?'text-red-400':'text-green-400'}">${left<=0?'منتهي':'باقي '+left+' يوم'} - ينتهي ${ex.toLocaleDateString()}</p></div><button onclick="saas.companies=saas.companies.filter(x=>x.id!==${c.id});save();renderSuper()" class="bg-red-600 px-3 py-1 rounded text-xs h-fit">حذف</button></div>`}).join('')}
function aTab(t){document.querySelectorAll('.aSec').forEach(s=>s.classList.add('hidden')); document.getElementById('a_'+t).classList.remove('hidden')}
function render(){let ex=db.exports.reduce((s,x)=>s+x.total,0), im=db.imports.reduce((s,x)=>s+x.cost,0); document.getElementById('eT').innerText=ex.toLocaleString(); document.getElementById('iT').innerText=im.toLocaleString(); document.getElementById('nT').innerText=(ex-im).toLocaleString(); document.getElementById('oT').innerHTML=db.prices.map(p=>`<option value="${p.name}|${p.price}">${p.name} - ${p.price.toLocaleString()}</option>`).join(''); document.getElementById('oD').innerHTML=db.drivers.map(d=>`<option>${d.name}</option>`).join('')||'<option>أضف سائق</option>'; document.getElementById('pE').innerHTML=db.prices.map((p,i)=>`<div class="flex gap-2 mb-2"><span class="w-10">${p.name}</span><input id="pr_${i}" value="${p.price}" class="flex-1 bg-slate-800 p-2 rounded-xl text-sm"><button onclick="db.prices.splice(${i},1);save();render()" class="bg-red-600 px-2 rounded">X</button></div>`).join(''); document.getElementById('oL').innerHTML=db.orders.map(o=>`<div class="glass p-3 rounded-xl mb-2"><b>${o.customer}</b><p class="text-xs text-slate-400">${o.qty}م3 ${o.type} - ${o.driver}</p><p class="text-xs">${o.price.toLocaleString()} - ${o.fp||'لم يبصم'}</p><button onclick="let oo=db.orders.find(x=>x.id===${o.id});oo.fp=new Date().toLocaleString('ar-EG');db.receipts.unshift(oo);save();render()" class="w-full bg-orange-500 mt-2 p-2 rounded-xl text-xs">بصمة استلام + جمع مع الراتب</button></div>`).join(''); document.getElementById('dL').innerHTML=db.drivers.map((d,i)=>`<div class="glass p-2 rounded-xl mb-1 flex justify-between"><span>${d.name} - ${d.car}</span><button onclick="db.drivers.splice(${i},1);save();render()" class="bg-red-600 px-2 rounded text-xs">حذف</button></div>`).join(''); document.getElementById('imL').innerHTML=db.imports.map(x=>`<div class="glass p-2 rounded-xl mb-1 flex justify-between"><span>${x.item}</span><span class="text-red-400">${x.cost.toLocaleString()}</span></div>`).join(''); document.getElementById('exL').innerHTML=db.exports.map(x=>`<div class="glass p-2 rounded-xl mb-1 flex justify-between"><span>${x.customer}</span><span class="text-green-400">${x.total.toLocaleString()}</span></div>`).join(''); document.getElementById('moL').innerHTML=`<div class="glass p-4 rounded-xl">داخل: ${ex.toLocaleString()}<br>خارج: ${im.toLocaleString()}<br><b>الصافي: ${(ex-im).toLocaleString()}</b></div>`; document.getElementById('wL').innerHTML=db.receipts.map(r=>`<div class="flex justify-between text-xs mb-1"><span>#${r.id.toString().slice(-4)} ${r.customer} ${r.qty}م3</span><span>${r.price.toLocaleString()}</span></div>`).join(''); let tm=db.receipts.reduce((s,r)=>s+r.qty,0); document.getElementById('sal').innerText='الوصولات: '+db.receipts.length+' - الأمتار: '+tm+' - الراتب: '+(tm*2000+750000).toLocaleString();}
function saveP(){db.prices.forEach((p,i)=>{p.price=parseInt(document.getElementById('pr_'+i).value)||p.price}); save(); render()}
function addD(){let n=document.getElementById('dN').value, c=document.getElementById('dC').value; if(!n)return; db.drivers.push({name:n,car:c}); save(); render(); document.getElementById('dN').value=''; document.getElementById('dC').value=''}
function addO(){let c=document.getElementById('oC').value, q=parseFloat(document.getElementById('oQ').value)||0, ty=document.getElementById('oT').value, dr=document.getElementById('oD').value, lo=document.getElementById('oL').value; if(!c||!q)return; let [tn,tp]=ty.split('|'); let pr=q*parseInt(tp); db.orders.unshift({id:Date.now(),customer:c,qty:q,type:tn,driver:dr,location:lo,price:pr,fp:''}); db.exports.unshift({id:Date.now(),customer:c,qty:q,total:pr}); save(); render()}
function addIm(){let i=document.getElementById('imI').value, co=parseInt(document.getElementById('imC').value)||0; if(!i||!co)return; db.imports.unshift({item:i,cost:co}); save(); render()}
function doFP(){db.attendance.push({time:new Date().toLocaleString('ar-EG')}); save(); document.getElementById('fpS').innerText='تمت البصمة ✅ '+new Date().toLocaleTimeString('ar-EG')}
</script>
</body>
</html>
